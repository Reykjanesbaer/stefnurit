# The gate on every change to the stefnurit document.
#
# The workflow is named "stefnurit" and the job "validate" so the required
# status check reads exactly "stefnurit / validate" in the branch ruleset.
#
# Deliberately `pull_request`, never `pull_request_target`: this checks out and
# runs code from the pull request, so it must not have access to secrets or to a
# writable token on an untrusted branch. The only elevated permission is
# pull-requests: write, used to keep one comment up to date, and GitHub already
# downgrades that to read for pull requests from forks.
name: stefnurit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The link check diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate the document
        run: node scripts/validate-document.mjs

      - name: Build
        run: npm run build

      # After the build: /admin/ in the tests is served from admin/dist, so these
      # exercise the panel that actually ships, not the sources.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      # The trace and the HTML report are the only way to see why a browser test
      # failed on a runner nobody can attach a debugger to.
      - name: Keep the report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the links this pull request changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-changed-links.mjs --base ${{ github.base_ref }}
