<!doctype html>

<style>
  body { margin: 0; padding: 20px; font: 400 15px/1.5 system-ui, sans-serif; background: #fff; }
  h2 { font-size: 14px; color: #5A616B; margin: 24px 0 8px; }

<body>
<!--
  Checks the *built* artifacts, which is what a CMS actually loads — the other
  demo pages run the source modules and would not catch a packaging mistake.
  Needs `npm run build` first.
-->
<h2>dist/stefnu-rit.js — ES module</h2>
<script type="module" src="../dist/stefnu-rit.js"></script>
<stefnu-rit id="esm" src="../src/data/stefnurit.json"></stefnu-rit>

<h2>dist/stefnu-rit.iife.js — plain script, for a CMS that cannot emit type="module"</h2>
<script src="../dist/stefnu-rit.iife.js"></script>
<stefnu-rit id="iife" src="../src/data/stefnurit.json"></stefnu-rit>
</body>
